name: Update TFT metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-tft-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update transformed metadata
        env:
          TFT_MAX_DECKS: "12"
          LOLCHESS_REQUEST_INTERVAL_MS: "1800"
        run: node scripts/update-from-lolchess.mjs

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs catalog.json

      - name: Commit changed catalog
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then
            echo "No metadata changes"
            exit 0
          fi
          git config user.name "tft-vision-meta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "data: refresh TFT metadata"
          git push
